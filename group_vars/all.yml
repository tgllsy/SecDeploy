timezone_name: Asia/Shanghai

enable_system_tune: true
enable_swap: true  # 启用交换空间设置
swap_size_percentage: 100  # 内存小于8GB时，交换空间为内存的100%
swap_size_min: 1  # 最小交换空间1GB
swap_size_max: 16  # 最大交换空间16GB
sysctl_tune:
  fs.file-max: 2097152
  net.core.somaxconn: 4096
  net.core.netdev_max_backlog: 16384
  net.ipv4.tcp_fin_timeout: 15
  net.ipv4.tcp_keepalive_time: 600
  net.ipv4.ip_local_port_range: "10240 65535"
  net.ipv4.tcp_max_syn_backlog: 8192
  net.ipv4.tcp_tw_reuse: 1
  net.core.default_qdisc: fq
  net.ipv4.tcp_congestion_control: bbr
  vm.swappiness: 60  # 系统交换倾向，0-100，数值越大越倾向于使用交换空间
  vm.vfs_cache_pressure: 100  # 缓存回收压力

enable_bbr: true

base_packages:
  - ca-certificates
  - curl
  - wget
  - gnupg
  - lsb-release
  - git
  - vim
  - tmux
  - unzip
  - zip
  - tar
  - jq
  - net-tools
  - iproute2
  - dnsutils
  - tcpdump
  - htop
  - tree
  - bash-completion
  - ufw
  - tzdata
  - nginx


dev_packages_debian:
  - build-essential
  - pkg-config
  - python3
  - python3-pip
  - python3-venv
  - python3-dev
  - pipx
  - golang
  - openjdk-11-jdk
  - openjdk-11-jre-headless
  - nodejs
  - npm

pip_index_url: https://pypi.tuna.tsinghua.edu.cn/simple

pentest_packages_debian:
  - nmap
  - masscan
  - nikto
  - sqlmap
  - hydra
  - john
  - hashcat
  - gobuster
  - dirb
  - whatweb
  - wireshark-common
  - tshark
  - netcat-traditional
  - socat
  - seclists


pentest_install_kali_meta: true
kali_meta_packages:
  - kali-tools-top10

# 从GitHub releases获取的工具配置
github_tools:
  - name: nuclei
    repo: projectdiscovery/nuclei
    binary_name: nuclei
    install_dir: /usr/local/bin
    asset_pattern: "nuclei.*linux.*amd64.*(zip|tar.gz)"
    enabled: true

  - name: naabu
    repo: projectdiscovery/naabu
    binary_name: naabu
    install_dir: /usr/local/bin
    asset_pattern: "naabu.*linux.*amd64.*(zip|tar.gz)"
    enabled: true

  - name: subfinder
    repo: projectdiscovery/subfinder
    binary_name: subfinder
    install_dir: /usr/local/bin
    asset_pattern: "subfinder.*linux.*amd64.*(zip|tar.gz)"
    enabled: true

  - name: observer_ward
    repo: emo-crab/observer_ward
    binary_name: observer_ward
    install_dir: /usr/local/bin
    asset_pattern: "observer_ward.*linux.*amd64.*(zip|tar.gz)"
    enabled: true

  - name: afrog
    repo: zan8in/afrog
    binary_name: afrog
    install_dir: /usr/local/bin
    asset_pattern: "afrog.*linux.*amd64.*(zip|tar.gz)"
    enabled: true

  - name: httpx
    repo: projectdiscovery/httpx
    binary_name: httpx
    install_dir: /usr/local/bin
    asset_pattern: "httpx.*linux.*amd64.*(zip|tar.gz)"
    enabled: true

docker_users: []

docker_registry_mirrors: []
docker_daemon_options:
  "iptables": false
  "ip-masq": false
  "userland-proxy": false

# UFW 配置
ufw_enabled: true
ufw_default_policy: "deny"
ufw_allow_ports:
  - "22"
  - "80"
  - "443"
  - "8080"
  - "8888"
  - "9000:9100"
  - "12345"

arl_enable: true  # 控制是否启用 ARL 安装
# ARL 配置已通过 setup_docker.sh 脚本管理

# Nginx 代理配置
nginx_proxy_user: admin  # 自定义代理认证头中的用户名称
nginx_proxy_password: admin123  # htpasswd 认证密码
nginx_htpasswd_file: /etc/nginx/.htpasswd  # htpasswd 文件路径
